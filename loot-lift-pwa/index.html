<style>
/* Layout: phone-shaped app shell (max 480px, centered on desktop) on a rubber gym floor; fixed bottom tab bar.
   Workout tiers are colored like Olympic bumper plates: 10 kg green, 15 kg yellow, 20 kg blue, 25 kg red. */
:root {
  color-scheme: dark;
  --floor: #14161b;
  --panel: #1e2129;
  --panel-2: #282c36;
  --line: #343946;
  --chalk: #eef0f3;
  --dim: #9097a6;
  --p10: #2fae5b;
  --p15: #f2c230;
  --p20: #2f74d8;
  --p25: #e0393e;
  --r0: #a3abb9;
  --r1: #4fa3ff;
  --r2: #b46cff;
  --r3: #ffb627;
  --r4: #ff4fa3;
  --r5: #ff7a1a;
  --r6: #f2c94c;
  --olympian: linear-gradient(110deg, #fff6c9 0%, #e7b53c 16%, #9c6b12 28%, #f4f7fb 42%, #9aa6b8 54%, #ffffff 62%, #d9a53a 76%, #fff1b0 88%, #b9c3d1 100%);
  --rainbow: linear-gradient(90deg, #ff3b3b, #ffb627, #f2ff3b, #3bff8a, #3bb5ff, #b46cff, #ff4fa3);
  --ink: #101216;
  --accent: var(--p25);   /* logo, selected tab, toggles, muscle map: themes change this */
  --btn: var(--chalk);    /* main buttons */
  --display: "Saira Stencil One", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --nav-h: 64px;
}
/* Gold theme: the Grand Champion prize (black and gold). Turned on with <html class="gold">. */
html.gold {
  --floor: #0b0a08; --panel: #17140d; --panel-2: #221d12; --line: #3d3220;
  --chalk: #fbefc8; --dim: #b9a77c; --ink: #140f05;
  --p10: #a8781f; --p15: #c9962e; --p20: #e2b546; --p25: #f5cf62;
  --gold: linear-gradient(135deg, #fff1b8 0%, #f2c94c 35%, #b8862b 70%, #f7dc85 100%);
}
html.gold .brand, html.gold .brand span { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
html.gold .btn.primary, html.gold .lvl-badge, html.gold .seg button[aria-pressed="true"], html.gold .chip[aria-pressed="true"],
html.gold .toast, html.gold .banner, html.gold .haul li .new { background: var(--gold); color: var(--ink); border-color: transparent; }
html.gold .xpbar i, html.gold .achbar i, html.gold .ach .pbar i { background: var(--gold); opacity: 1; }
html.gold .card { box-shadow: inset 0 0 0 1px #f2c94c26; }
html.gold .nav button[aria-selected="true"] { color: #f7dc85; }
html.gold .nav { border-top-color: #f2c94c40; }
html.gold .top { border-bottom-color: #f2c94c40; }
html, body { background: var(--floor); color: var(--chalk); }
[hidden] { display: none !important; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  background:
    radial-gradient(circle at 20% 10%, #ffffff06 0 1px, transparent 1px) 0 0 / 7px 7px,
    radial-gradient(circle at 70% 60%, #00000040 0 1px, transparent 1px) 0 0 / 5px 5px,
    var(--floor);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--floor); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}

/* ---------- header ---------- */
.top { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--floor); padding-block: 8px 10px; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-size: 28px; letter-spacing: .02em; line-height: 1; margin: 0; }
.brand span { color: var(--accent); }
.lvl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lvl-badge { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; background: var(--chalk); color: var(--ink); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.xpbar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; min-width: 32px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--p10), var(--p15), var(--p20), var(--p25)); border-radius: inherit; transition: width .5s; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; }
.stat b { font-family: var(--label); font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }

/* ---------- bottom nav ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--dim); font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: .03em; padding: 0; min-width: 0; text-transform: uppercase; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--chalk); }
.nav button[aria-selected="true"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.nav .badge { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--accent); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; letter-spacing: 0; }

/* ---------- generic ---------- */
h2 { font-family: var(--display); font-size: 22px; font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; }
.eyebrow { font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); color: var(--chalk); min-height: 50px; }
.btn.primary { background: var(--btn); color: var(--ink); }
/* bought color themes (html[data-theme]); their colors are set from THEMES in the script */
html[data-theme] .nav .badge { color: var(--ink); }
/* Christmas: the one light theme. Red logo and accents, green buttons, snow falling. */
html[data-theme="xmas"], html[data-light] { color-scheme: light; }
html[data-theme="xmas"] .brand { color: #1f8a46; }
html[data-theme="xmas"] section > .card, html[data-theme="xmas"] section > form.card { box-shadow: inset 0 4px 0 #d42a2f, 0 2px 8px #6d9dc21f; }
html[data-theme="xmas"] section > .card:nth-of-type(even), html[data-theme="xmas"] section > form.card:nth-of-type(even) { box-shadow: inset 0 4px 0 #1f8a46, 0 2px 8px #6d9dc21f; }
/* candy-cane stripe under the header */
html[data-theme="xmas"] .top { border-bottom: 0; box-shadow: 0 5px 0 -1px transparent; background-image: linear-gradient(var(--floor), var(--floor)), repeating-linear-gradient(-45deg, #d42a2f 0 10px, #ffffff 10px 20px, #1f8a46 20px 30px, #ffffff 30px 40px); background-size: 100% calc(100% - 6px), 100% 6px; background-position: top, bottom; background-repeat: no-repeat; padding-bottom: 16px; }
/* stat boxes alternate red and green */
html[data-theme="xmas"] .stat:nth-child(odd) { background: #fde6e6; }
html[data-theme="xmas"] .stat:nth-child(odd) b { color: #b8222a; }
html[data-theme="xmas"] .stat:nth-child(even) { background: #e2f4e8; }
html[data-theme="xmas"] .stat:nth-child(even) b { color: #18723a; }
html[data-theme="xmas"] .lvl-badge { background: #d42a2f; color: #fff; }
html[data-theme="xmas"] .xpbar i { background: repeating-linear-gradient(-45deg, #d42a2f 0 8px, #1f8a46 8px 16px); }
/* green headings, red labels */
html[data-theme="xmas"] h2 { color: #18723a; }
html[data-theme="xmas"] .eyebrow { color: #c42228; }
/* green bottom bar with white icons and a red marker */
html[data-theme="xmas"] .nav { background: #18723a; border-top: 3px solid #d42a2f; }
html[data-theme="xmas"] .nav button { color: #cfead8; }
html[data-theme="xmas"] .nav button[aria-selected="true"] { color: #ffffff; }
html[data-theme="xmas"] .nav button[aria-selected="true"]::after { background: #ff5a5f; height: 4px; }
html[data-theme="xmas"] .nav .badge { background: #d42a2f; color: #fff; box-shadow: 0 0 0 2px #18723a; }
/* workout rows and items edged in red and green */
html[data-theme="xmas"] .ex { border-left: 4px solid #d42a2f; border-radius: 0 10px 10px 0; }
html[data-theme="xmas"] .ex:nth-child(even) { border-left-color: #1f8a46; }
html[data-theme="xmas"] .chip { border-color: #1f8a46; color: #18723a; }
html[data-theme="xmas"] .toast { background: #18723a; color: #fff; }
/* theme backgrounds and effects. #bgfx sits behind the app (cards stay readable); #snow falls over it. */
.app { position: relative; z-index: 1; }
#bgfx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#bgfx .rain { position: absolute; top: 0; font: 15px/1.05 ui-monospace, Menlo, monospace; color: #22ff66; text-shadow: 0 0 6px #22ff66; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; opacity: .32; animation: rain linear infinite; }
@keyframes rain { from { transform: translateY(-100%); } to { transform: translateY(110vh); } }
#bgfx .aur { position: absolute; width: 90vw; height: 55vh; border-radius: 50%; filter: blur(50px); opacity: .6; animation: aur 14s ease-in-out infinite alternate; }
@keyframes aur { 0% { transform: translate(-10vw, -6vh) scale(1); } 50% { transform: translate(8vw, 2vh) scale(1.15); } 100% { transform: translate(18vw, -4vh) scale(.95); } }
/* with a moving background, the header and cards turn slightly see-through so it glows behind them */
html[data-fx] .top { background: color-mix(in srgb, var(--floor) 72%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
html[data-fx] .card, html[data-fx] .stat { background: color-mix(in srgb, var(--panel) 84%, transparent); }
#bgfx .spark { position: absolute; width: 5px; height: 5px; background: #8fd3ff; border-radius: 50%; box-shadow: 0 0 10px 3px #5cb8f0; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.3); } }
#bgfx .grid { position: absolute; left: -50%; right: -50%; bottom: 0; height: 45vh; transform-origin: bottom; transform: perspective(300px) rotateX(62deg);
  background: repeating-linear-gradient(90deg, #ff4fd8aa 0 2px, transparent 2px 60px), repeating-linear-gradient(0deg, #2ef2e0aa 0 2px, transparent 2px 46px); background-size: auto, 100% 46px; animation: gridmove 2.4s linear infinite; opacity: .6; }
@keyframes gridmove { to { background-position: 0 0, 0 46px; } }
#bgfx .sun { position: absolute; left: 50%; bottom: 30vh; width: 46vw; max-width: 260px; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; opacity: .35;
  background: repeating-linear-gradient(0deg, transparent 0 8px, #160a2c 8px 12px) bottom / 100% 45% no-repeat, linear-gradient(180deg, #ffd56b, #ff4fd8 70%); }
#bgfx .glow { position: absolute; width: 90vw; height: 90vw; max-width: 700px; max-height: 700px; border-radius: 50%; filter: blur(60px); opacity: .35; animation: glow 6s ease-in-out infinite alternate; }
@keyframes glow { to { opacity: .55; transform: scale(1.08); } }
html[data-theme="camo"] body { background:
  radial-gradient(ellipse 60px 34px at 20% 30%, #3e4a2c 98%, transparent) 0 0 / 220px 180px,
  radial-gradient(ellipse 70px 40px at 70% 70%, #1a2014 98%, transparent) 0 0 / 220px 180px,
  radial-gradient(ellipse 50px 30px at 80% 20%, #5a5236 98%, transparent) 0 0 / 220px 180px,
  radial-gradient(ellipse 40px 46px at 35% 80%, #313b22 98%, transparent) 0 0 / 220px 180px, #232a1c; }
@media (prefers-reduced-motion: reduce) { #bgfx * { animation: none !important; } }
#snow { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
#snow i { position: absolute; top: -12px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 3px #9cc7ea; opacity: .9; animation: snowfall linear infinite; }
@keyframes snowfall { 0% { transform: translate(0, -12px); } 25% { transform: translate(12px, 25vh); } 50% { transform: translate(-8px, 50vh); } 75% { transform: translate(10px, 75vh); } 100% { transform: translate(0, 105vh); } }
@media (prefers-reduced-motion: reduce) { #snow { display: none; } }
html[data-theme] .chip[aria-pressed="true"], html[data-theme] .seg button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--ink); }
html[data-theme] .card { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent); }
.themeprev { width: 100%; aspect-ratio: 1.6; border-radius: 10px; background: var(--tf); padding: 8px; display: flex; flex-direction: column; gap: 5px; border: 1px solid #ffffff1a; }
.themeprev .tp-bar { height: 10px; width: 55%; border-radius: 3px; background: var(--ta); }
.themeprev .tp-card { flex: 1; border-radius: 6px; background: var(--tp); display: flex; align-items: flex-end; padding: 5px; gap: 4px; }
.themeprev .tp-btn { height: 10px; flex: 1; border-radius: 3px; background: var(--tb); }
.themeprev .tp-dot { height: 10px; width: 10px; border-radius: 50%; background: var(--ta); }
.codebox { width: 100%; font: 13px/1.35 ui-monospace, Menlo, monospace; color: var(--chalk); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; word-break: break-all; }
.infotip summary { cursor: pointer; font-weight: 600; }
.themepick { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.themepick button { background: var(--panel-2); border: 2px solid transparent; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.themepick button[aria-pressed="true"] { border-color: var(--accent); }
.btn.go { background: var(--tc, var(--p10)); color: var(--ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.muted { color: var(--dim); }
.note { font-size: 14px; color: var(--dim); margin: 0; }
section[role="tabpanel"] { display: flex; flex-direction: column; gap: 16px; }

/* ---------- plates (tier picker) ---------- */
.plates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.plate { background: none; border: 0; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 12px; }
.plate .disc {
  width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle, #0c0d10 0 13%, #3a3f4a 13.5% 17%, transparent 17.5%),
    radial-gradient(circle, transparent 0 62%, #00000033 62.5% 64%, transparent 64.5%),
    var(--tc);
  box-shadow: inset 0 -5px 0 #00000040, 0 4px 0 #00000055;
  display: grid; place-items: center; transition: transform .15s;
}
.plate .disc b { position: absolute; top: 12%; font-family: var(--label); font-weight: 700; font-size: 13px; color: var(--ink); opacity: .85; }
.plate .nm { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.plate[aria-pressed="true"] .disc { transform: scale(1.06); outline: 3px solid var(--chalk); outline-offset: 3px; }
.plate[aria-pressed="true"] .nm { color: var(--chalk); }
.plate:disabled { opacity: .35; cursor: not-allowed; }
.tierinfo { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--label); font-size: 14px; letter-spacing: .04em; color: var(--dim); }
.tierinfo b { color: var(--chalk); }

/* ---------- workout ---------- */
.wo-head { display: flex; align-items: flex-start; gap: 12px; }
.wo-head .tchip { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--tc); color: var(--ink); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.modeseg { display: flex; width: 100%; }
.modeseg button { flex: 1; min-height: 44px; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: var(--chalk); }
.chip[aria-pressed="true"]::before { content: "✓"; font-size: 13px; }
.chip:disabled { opacity: .45; }
.wo-meta { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--label); font-size: 15px; color: var(--dim); }
.wo-meta b { color: var(--chalk); font-variant-numeric: tabular-nums; }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex { display: flex; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 10px; padding: 12px; min-height: 56px; }
.ex input { width: 26px; height: 26px; accent-color: var(--tc); flex: none; }
.ex label { flex: 1; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
.ex .nm { font-weight: 600; }
.ex .hint { font-size: 13px; color: var(--dim); }
.ex .amt { font-family: var(--label); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ex.done { opacity: .55; }
.ex.done .nm { text-decoration: line-through; }
.ex input:disabled + label { cursor: default; }
.timer { font-family: var(--label); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.lockline { font-family: var(--label); font-size: 15px; color: var(--dim); }
.earned { align-items: center; text-align: center; }

/* ---------- crates ---------- */
.crate {
  --cw: 110px;
  width: var(--cw); height: calc(var(--cw) / 1.15); flex: none; position: relative; border-radius: 6px;
  background:
    linear-gradient(90deg, #00000038 0 9%, transparent 9% 91%, #00000038 91%),
    linear-gradient(0deg, #00000030 0 10%, transparent 10% 74%, #ffffff26 74% 77%, #00000030 77%),
    var(--tc);
  box-shadow: inset 0 0 0 3px #00000040, 0 6px 0 #00000066;
  display: grid; place-items: center;
}
/* long names (POWERLIFTER) get a smaller size so the label stays on one line and the crate keeps its shape */
.crate::after { content: attr(data-label); font-family: var(--display); font-size: calc(var(--cw) * var(--lf, .13)); white-space: nowrap; max-width: 92%; overflow: hidden; color: var(--ink); opacity: .78; margin-top: 14%; }
.crate.glow { box-shadow: inset 0 0 0 3px #00000040, 0 6px 0 #00000066, 0 0 calc(var(--cw) * .22) var(--tc); }
.crate.pwr {
  background:
    linear-gradient(90deg, #00000038 0 9%, transparent 9% 91%, #00000038 91%),
    linear-gradient(0deg, #00000030 0 10%, transparent 10% 74%, #ffffff40 74% 77%, #00000030 77%),
    var(--rainbow);
  background-size: 100% 100%, 100% 100%, 200% 100%;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer { to { background-position: 0 0, 0 0, 200% 0; } }
.rainbow-text { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
/* Olympian: gold and silver */
.crate.oly {
  background:
    linear-gradient(90deg, #00000030 0 9%, transparent 9% 91%, #00000030 91%),
    linear-gradient(0deg, #00000026 0 10%, transparent 10% 74%, #ffffff80 74% 77%, #00000026 77%),
    var(--olympian);
  background-size: 100% 100%, 100% 100%, 250% 100%;
  box-shadow: inset 0 0 0 3px #7a5a1a66, 0 6px 0 #00000066, 0 0 calc(var(--cw) * .25) #f2c94caa, 0 0 calc(var(--cw) * .5) #e8edf255;
  animation: shimmer 4s linear infinite;
}
.crate.oly::after { color: #3a2a06; opacity: .85; text-shadow: 0 1px 0 #ffffff99; }
.crate.locked { filter: grayscale(.85) brightness(.55); animation: none; box-shadow: inset 0 0 0 3px #00000040, 0 6px 0 #00000066; }
.oly-text { background: var(--olympian); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 4s linear infinite; }
.reveal.oly .rays { background: repeating-conic-gradient(#f2c94c 0 6deg, transparent 6deg 12deg, #e8edf2 12deg 18deg, transparent 18deg 24deg); opacity: .8; }
.slot.oly::before { background: conic-gradient(#f2c94c, #ffffff, #b9c3d1, #e7b53c, #f2c94c); opacity: .8; filter: blur(4px); }
/* the OLYMPIAN AURA sign: white-hot letters with a gold and silver neon glow that breathes and flickers */
.neon.aura {
  color: #fffdf3; letter-spacing: .04em;
  text-shadow: 0 0 2px #fff, 0 0 6px #fff6c9, 0 0 12px #f2c94c, 0 0 22px #e7b53c, 0 0 34px #d9a53a, 0 0 48px #e8edf2, 0 0 70px #b9c3d1;
  animation: aura 3.2s ease-in-out infinite;
}
@keyframes aura {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 6px #f2c94c88); }
  45% { filter: brightness(1.25) drop-shadow(0 0 14px #ffffffaa); }
  47% { filter: brightness(.7); } 48% { filter: brightness(1.3); } 50% { filter: brightness(.85); } 52% { filter: brightness(1.2) drop-shadow(0 0 12px #f2c94caa); }
}
.slot .neon.aura { font-size: clamp(7px, 2.05vw, 10px); letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { .neon.aura, .crate.oly, .oly-text { animation: none; } }
.streak { gap: 10px; }
.streak .flame { font-size: 30px; line-height: 1; filter: grayscale(1); opacity: .5; }
.streak.lit .flame { filter: none; opacity: 1; animation: flick 1.6s ease-in-out infinite; }
@keyframes flick { 50% { transform: scale(1.08) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .streak.lit .flame { animation: none; } }
.streak .streakn { font-family: var(--display); font-size: 22px; line-height: 1.1; }
/* shop */
.coins { display: flex; align-items: center; gap: 12px; }
.coins .big { font-family: var(--display); font-size: 34px; line-height: 1; }
.coin { display: inline-block; flex: none; vertical-align: -0.2em; filter: drop-shadow(0 1px 1px #0006); }
.coin svg { width: 100%; height: 100%; display: block; }
.coinamt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.price { font-family: var(--label); font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.shopgrid .item { gap: 6px; padding-bottom: 10px; }
.shopgrid .btn, .sellrow .btn { min-height: 40px; padding: 6px 12px; font-size: 15px; width: 100%; }
.shopgrid .item.owned { opacity: .55; }
.sellrow { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; border-left: 4px solid var(--rc); }
.sellrow .em { font-size: 24px; text-align: center; }
.sellrow .nm { display: flex; flex-direction: column; min-width: 0; font-weight: 600; }
.sellrow .nm small { color: var(--dim); font-weight: 500; font-size: 13px; }
.sellrow .btns { display: flex; gap: 6px; }
.sellrow .btn { width: auto; }
.cratebuy { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.cratebuy .btn { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.olyprog { height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
.olyprog i { display: block; height: 100%; background: var(--olympian); background-size: 200% 100%; }
.crate::before { content: ""; position: absolute; left: 42%; right: 42%; top: 18%; height: 14%; background: #0000004d; border-radius: 3px; }
.crategrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.cratecard { background: var(--panel-2); border-radius: 12px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cratecard .nm { font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; }
.odds i { display: block; height: 100%; }
/* open all */
.openall { display: flex; gap: 10px; align-items: stretch; background: var(--panel-2); border-radius: 12px; padding: 10px; }
.openall .sel { position: relative; flex: 1; min-width: 0; display: flex; }
.openall select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--chalk); font: 600 16px/1.2 inherit; font-family: inherit; padding: 10px 38px 10px 12px; }
.openall .sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.openall .btn { min-height: 46px; padding: 8px 16px; flex: none; }
.haul { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.haul .best { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.haul .best .big { font-size: 72px; line-height: 1; }
.haul ul { list-style: none; margin: 0; padding: 4px; display: flex; flex-direction: column; gap: 6px; max-height: max(120px, calc(100vh - 440px)); max-height: max(120px, calc(100dvh - 440px)); overflow-y: auto; text-align: left; }
.haul li { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 10px; padding: 8px 10px; border-left: 4px solid var(--rc); }
.haul li .em { font-size: 24px; width: 30px; text-align: center; flex: none; }
.haul li .swatch { width: 30px; height: 22px; border-radius: 5px; flex: none; }
.haul li .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 600; }
.haul li .nm small { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.haul li .new { font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .06em; background: var(--chalk); color: var(--ink); border-radius: 5px; padding: 2px 5px; flex: none; }
.haul li .ct { font-family: var(--label); font-weight: 700; font-size: 18px; flex: none; }
.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.loglist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.loglist .em { font-size: 22px; width: 28px; text-align: center; }
.rtag { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--rc); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 5px; font-family: var(--label); font-size: 13px; color: var(--dim); }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--rc); }

/* ---------- gym room ---------- */
.room { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); position: relative; user-select: none; }
.wall { padding: 12px 10px 14px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-height: 96px; align-items: center; position: relative; }
.wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #00000059; }
.flr { padding: 10px 8px 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 6px; }
.slot { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; position: relative; background: none; border: 0; padding: 0; min-width: 0; }
.wall .slot { background: #ffffff0a; border: 1px dashed #ffffff1f; }
.flr .slot::before { content: ""; position: absolute; left: 14%; right: 14%; bottom: 8%; height: 16%; border-radius: 50%; background: #00000038; }
.slot.filled::before { background: radial-gradient(closest-side, var(--rc), transparent); opacity: .55; }
.wall .slot.filled { border-style: solid; border-color: transparent; background: #00000026; box-shadow: 0 0 14px -4px var(--rc); }
.sprite { font-size: clamp(22px, 8vw, 34px); line-height: 1; position: relative; filter: drop-shadow(0 3px 2px #00000066); }
.flr .r0 .sprite { transform: scale(.82) translateY(4px); }
.flr .r2 .sprite { transform: scale(1.12); }
.neon { font-family: var(--display); font-size: clamp(9px, 2.7vw, 12px); color: #fff; text-shadow: 0 0 4px var(--rc), 0 0 10px var(--rc), 0 0 18px var(--rc); line-height: 1; text-align: center; }
.room.placing .slot.target { outline: 2px dashed var(--chalk); outline-offset: -2px; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { background-color: #ffffff22; } }
.room-label { position: absolute; top: 6px; right: 8px; font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #ffffff80; z-index: 1; pointer-events: none; }

/* wall skins */
.wall.sk-concrete { background: linear-gradient(180deg, #3b404b, #2e323b); }

  background-color: #7a3a2c;
  background-image:
    linear-gradient(0deg, #4b2219 2px, transparent 2px),

  background-size: 100% 18px, 36px 36px, 36px 36px;
  background-position: 0 0, 0 0, 18px 18px;
}
.wall.sk-neon { background: radial-gradient(120% 90% at 50% 0%, #3d1460, #160a26 70%); box-shadow: inset 0 3px 0 #ff3cf0, inset 0 -11px 0 -3px #22e6ff; }

.flr.sk-court { background: repeating-linear-gradient(90deg, #b9824a 0 22px, #a8733f 22px 23px, #c48e55 23px 45px, #a8733f 45px 46px); box-shadow: inset 0 10px 0 -6px #ffffffb0; }
.flr.sk-gold { background: linear-gradient(135deg, #8a6417, #f3c64b 30%, #b88a24 55%, #ffe08a 75%, #9b7019); }

.wall.sk-lockers {

}
.wall.sk-marble { background:
    linear-gradient(115deg, transparent 0 30%, #d9a53a 30.2% 30.6%, transparent 30.8%),

    linear-gradient(75deg, transparent 0 74%, #c9b48a88 74.1% 74.4%, transparent 74.6%),

/* neon signs hang on a dark plaque so they stay readable on light walls (marble, clouds) */
.wall .slot.sign, .wall .slot.filled.sign { background: #0b0d12e0; }
.itemart { display: inline-grid; place-items: center; line-height: 1; }
.itemart svg { width: 1.2em; height: 1.2em; overflow: visible; filter: drop-shadow(0 3px 3px #0008) drop-shadow(0 0 6px #f2c94c55); }
.itemart .flame { transform-origin: 60px 40px; animation: flick .9s ease-in-out infinite; }
@keyframes flick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06, .94) translateY(1px); } }
@media (prefers-reduced-motion: reduce) { .itemart .flame { animation: none; } }
.flr.sk-track { background: repeating-linear-gradient(0deg, #b5452f 0 26px, #f2e9e4 26px 28px); }
.flr.sk-turf {
  background:
    linear-gradient(90deg, transparent 0 49.5%, #ffffffb0 49.5% 50.5%, transparent 50.5%),
    repeating-linear-gradient(90deg, #2f8f3a 0 30px, #2a8034 30px 60px);
}
.slot.pwr::before { background: conic-gradient(#ff3b3b, #ffb627, #3bff8a, #3bb5ff, #b46cff, #ff3b3b); opacity: .7; filter: blur(4px); }
.reveal.pwr .rays { background: repeating-conic-gradient(#ff3b3b 0 6deg, transparent 6deg 12deg, #ffb627 12deg 18deg, transparent 18deg 24deg, #3bff8a 24deg 30deg, transparent 30deg 36deg, #3bb5ff 36deg 42deg, transparent 42deg 48deg, #b46cff 48deg 54deg, transparent 54deg 60deg); opacity: .7; }
.rtag.rainbow-text, .eyebrow .rainbow-text { color: transparent; }

/* placing banner + inventory */
.banner { display: flex; align-items: center; gap: 10px; background: var(--chalk); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.banner .em { font-size: 24px; }
.banner button { margin-left: auto; background: var(--ink); color: var(--chalk); border: 0; border-radius: 8px; padding: 8px 12px; font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.invgroup { display: flex; flex-direction: column; gap: 8px; }
.invgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.item { background: var(--panel-2); border: 1px solid transparent; border-radius: 12px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center; min-width: 0; }
.item .em { font-size: 30px; line-height: 1.1; }
.item .nm { font-size: 13px; font-weight: 600; line-height: 1.2; }
.item .ct { position: absolute; top: 6px; right: 8px; font-family: var(--label); font-weight: 700; font-size: 13px; color: var(--dim); }
.item[aria-pressed="true"] { border-color: var(--chalk); }
.item .got { color: var(--p10); }
/* items you haven't found yet: a dark silhouette, no name, so you can't tell exactly what it is */
.item.missing .em { filter: brightness(0) drop-shadow(0 0 1px #ffffff40); opacity: .85; }
.item.missing .swatch { filter: brightness(0); box-shadow: 0 0 0 1px #ffffff26; }
.item.missing .neon { filter: brightness(0) blur(2.5px); opacity: .9; animation: none; }
.item.missing .nm { color: var(--dim); letter-spacing: .12em; }
.kind { font-size: 12px; color: var(--dim); }
/* settings */
.setrow { display: flex; align-items: center; gap: 14px; }
.setrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.setrow .txt b { font-size: 17px; }
.setrow .txt small { color: var(--dim); font-size: 14px; line-height: 1.4; }
.switch { position: relative; flex: none; width: 56px; height: 32px; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--panel-2); border: 2px solid var(--line, rgba(255,255,255,.18)); transition: background .2s, border-color .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(24px); background: var(--knob, #fff); }
.switch input:focus-visible + .track { outline: 3px solid var(--chalk); outline-offset: 2px; }
.dbtag { display: inline-block; font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); color: var(--chalk); border-radius: 6px; padding: 2px 6px; margin-right: 6px; vertical-align: 1px; }
.ex .dbtag { background: var(--panel); }
.fold { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 4px 0; min-height: 44px; text-align: left; }
.fold .chev { width: 22px; height: 22px; flex: none; display: grid; place-items: center; color: var(--dim); transition: transform .2s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.item::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--rc); }
.swatch { width: 44px; height: 30px; border-radius: 6px; border: 1px solid #ffffff30; }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stylebox { background: var(--panel-2); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.stylebox > div { min-width: 0; flex: 1; }
.stylebox small { display: block; }
.stylebox button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: var(--label); letter-spacing: .06em; text-transform: uppercase; }

/* ---------- leaderboard ---------- */
.seg { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
/* achievements */
.achhead { display: flex; flex-direction: column; gap: 8px; }
.achbar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.achbar i { display: block; height: 100%; background: linear-gradient(90deg, #d08a54, #d6dbe4, var(--r3)); }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach { position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border-radius: 12px; padding: 12px; border: 1px solid transparent; }
.ach .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--panel); filter: grayscale(1); opacity: .55; }
.ach b { font-size: 15px; line-height: 1.2; }
.ach small { color: var(--dim); font-size: 13px; line-height: 1.3; }
.ach .pbar { height: 5px; border-radius: 3px; background: var(--panel); overflow: hidden; margin-top: auto; }
.ach .pbar i { display: block; height: 100%; background: var(--chalk); opacity: .7; }
.ach .pnum { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--dim); }
.ach.done { border-color: color-mix(in srgb, var(--r3) 55%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--r3) 14%, var(--panel-2)), var(--panel-2) 60%); }
.ach.done .ic { filter: none; opacity: 1; background: color-mix(in srgb, var(--r3) 22%, var(--panel)); box-shadow: 0 0 14px color-mix(in srgb, var(--r3) 45%, transparent); }
.ach.done .pnum { color: var(--r3); }
.ach.done::after { content: "✓"; position: absolute; top: 10px; right: 12px; font-weight: 800; color: var(--r3); }

  const el = document.createElement(tag);

    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));

function myFocus() { return trainMode() === "calisthenics" ? (me.caliFocus || []).filter(id => CALI_BY_ID[id]) : (me.focus || []).filter(id => FOCUS_BY_ID[id]); }
function makeCaliWorkout(t) {
  const T = TIERS[t], focus = myFocus();
  // a drill fits the focus if it trains one of the picked skills
  const score = e => focus.length && e.skills.some(k => focus.includes(k)) ? 1 : 0;
  // only drills for the picked skills, even if that makes the workout a move shorter
  const pool = shuffle(EXERCISES.filter(e => e.cali && (e.min || 0) <= t && (!focus.length || score(e))));
  return finishWorkout(t, focus, shuffle(pool.slice(0, T.count)), "calisthenics");
}
function finishWorkout(t, focus, moves, mode) {
  const T = TIERS[t];
  const ex = moves.map(e => {
    const amt = e.kind === "reps" ? Math.max(1, Math.round(e.base * T.mult)) : Math.max(10, Math.round(e.base * T.mult / 5) * 5);
    const secs = e.kind === "reps" ? amt * e.spr : amt;
    return { name: e.name, kind: e.kind, amt, secs, hint: e.hint || "", db: !!e.db };
  });
  const est = Math.round(T.rounds * ex.reduce((a, b) => a + b.secs + 10, 0) + (T.rounds - 1) * 45);
  return { tier: t, mode, focus, title: pick(WORDS_A) + " " + pick(WORDS_B), ex, rounds: T.rounds, est, minSecs: Math.round(est * 0.5), startedAt: null, checks: ex.map(() => false), progress: ex.map(() => 0) };
}
function makeWorkout(t) {
  if (trainMode() === "calisthenics") return makeCaliWorkout(t);
  const T = TIERS[t], focus = myFocus();
  // with a focus, a move only fits if every muscle it mainly works is one you picked
  // (score 2). Partial matches (1) are only a backup if a level ever runs out of moves.
  const muscles = focus.flatMap(id => FOCUS_BY_ID[id].m);
  const score = e => { const x = HOWTO[e.name]; return !muscles.length || !x ? 0 : x.main.every(m => muscles.includes(m)) ? 2 : x.main.some(m => muscles.includes(m)) ? 1 : 0; };
  const rank = list => shuffle(list).sort((a, b) => score(b) - score(a)); // ties stay in random order
  const ok = e => (e.min || 0) <= t;
  const bw = rank(EXERCISES.filter(e => ok(e) && !e.db && !e.cali));
  const dbs = store.settings.dumbbells ? rank(EXERCISES.filter(e => ok(e) && e.db)) : [];
  // dumbbell mode: about half the moves use dumbbells, unless the other kind fits your focus better
  const wantDb = dbs.length ? Math.ceil(T.count / 2) : 0;
  let moves = [], nDb = 0;
  while (moves.length < T.count && (bw.length || dbs.length)) {
    const d = dbs[0], b = bw[0];
    const takeDb = !b || (d && (score(d) !== score(b) ? score(d) > score(b) : nDb < wantDb));
    moves.push(takeDb ? dbs.shift() : bw.shift());
    if (takeDb) nDb++;
  }
  return finishWorkout(t, focus, shuffle(moves), "lifting");
}

  knee:  [[J.lh, J.lk, J.la], [J.rh, J.rk, J.ra]],
  elbow: [[J.ls, J.le, J.lw], [J.rs, J.re, J.rw]],
  hip:   [[J.ls, J.lh, J.lk], [J.rs, J.rh, J.rk]],

const knees = lm => mid(lm[J.lk], lm[J.rk]);

/* confetti burst */
function confetti(r) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"); c.hidden = false;
  const dpr = devicePixelRatio || 1, W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const ctx = c.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const cols = r === OLY ? ["#f2c94c", "#fff1b0", "#d9a53a", "#e8edf2", "#b9c3d1", "#ffffff"]
    : [cs.getPropertyValue("--r" + r), cs.getPropertyValue("--p10"), cs.getPropertyValue("--p15"), cs.getPropertyValue("--p20"), cs.getPropertyValue("--p25"), "#ffffff"].map(s => s.trim());
  const n = 40 + r * 40;
  const ps = Array.from({ length: n }, () => ({ x: W / 2, y: H * 0.42, vx: (Math.random() - .5) * 22 * dpr, vy: (-Math.random() * 18 - 4) * dpr, s: (4 + Math.random() * 6) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: pick(cols) }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .6 * dpr; p.vx *= .985; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (++f < 110) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}

      h("summary", { text: "Make the home-screen icon match your theme" }),
      h("p", { class: "note", style: "margin:8px 0 6px", text: "Phones only pick up the icon when you add the app, so you'll add it again. Your progress comes with you through a backup:" }),
      h("ol", { class: "steps", style: "margin:0" },
        h("li", { text: "Pick your theme here, then tap Save backup file below and choose Save to Files." }),
        h("li", { text: "Open Rep Quest's website in Safari (or Chrome), go to Settings, tap Open backup file, pick your backup, and tap Restore twice." }),
        h("li", { text: "In the browser, tap Share, then Add to Home Screen. The new icon uses your theme's colors." }),
        h("li", { text: "Open the new icon, go to Settings and restore the same backup file again." }),
        h("li", { text: "Once your progress shows up in the new icon, delete the old icon from your home screen." }))) : null));
  root.append(h("div", { class: "card" },
    h("span", { class: "eyebrow", text: "Backup & restore" }),
    h("p", { class: "note", text: "Save everything on this phone (all players, items, coins and streaks) as a file, and keep it in the Files app. Use it before deleting the app, or to move to a new phone." }),
    h("button", { class: "btn primary wide", type: "button", onclick: saveBackupFile }, "Save backup file"),
    h("span", { class: "eyebrow", style: "margin-top:6px", text: "Restore" }),
    h("label", { class: "btn ghost", style: "display:flex;align-items:center;justify-content:center;cursor:pointer" }, "Open backup file",
      h("input", { type: "file", accept: ".txt,text/plain", hidden: true, onchange: e => openBackupFile(e.target) })),
    restoreDraft ? h("div", { class: "infotip", style: "display:flex;flex-direction:column;gap:10px" },
      h("span", {}, h("b", { text: "Ready to restore: " }), restoreFile || "backup file", ". This replaces everything on this phone."),
      h("div", { class: "row", style: "flex-wrap:nowrap" },
        h("button", { class: "btn " + (restoreArmed ? "go" : "primary"), type: "button", style: "flex:1;" + (restoreArmed ? "--tc:var(--p25)" : ""), onclick: () => restoreBackup(restoreDraft) },
          restoreArmed ? "Tap again to replace everything" : "Restore"),
        h("button", { class: "btn ghost", type: "button", onclick: () => { restoreDraft = ""; restoreFile = ""; restoreArmed = false; clearTimeout(restoreTimer); renderSettings(); } }, "Cancel"))) : null));
  const codeIn = h("input", { id: "secretCode", type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", enterkeyhint: "done", placeholder: "Enter code", "aria-label": "Secret code" });
  root.append(h("form", { class: "card", onsubmit: e => { e.preventDefault(); if (redeemCode(codeIn.value)) codeIn.value = ""; codeIn.blur(); } },
    h("span", { class: "eyebrow", text: "Secret code" }),
    h("p", { class: "note", text: "Got a code? Type it exactly, capitals and all." }),
    h("div", { class: "row", style: "flex-wrap:nowrap" }, codeIn, h("button", { class: "btn primary", type: "submit" }, "Redeem"))));
}

/* ================= tabs ================= */
function setTab(t) {
  tab = t;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  document.querySelectorAll("section[role=tabpanel]").forEach(s => { s.hidden = s.id !== "tab-" + t; });
  if (t !== "gym") placing = null;
  renderTab();
  window.scrollTo({ top: 0 });
}
function renderTab() {
  if (tab === "workout") renderWorkout();
  else if (tab === "crates") renderCrates();
  else if (tab === "gym") renderGym();
  else if (tab === "settings") renderSettings();
  else if (tab === "shop") renderShop();
  else renderBoard();
}
function renderAll() { renderHeader(); renderTab(); }
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
for (const id of ["#crateOv", "#gymOv"]) $(id).addEventListener("click", e => { if (e.target.id === id.slice(1) && id === "#gymOv") $(id).hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#gymOv").hidden = true; $("#infoOv").hidden = true; if (scan) stopScan(); } });
$("#infoOv").addEventListener("click", e => { if (e.target.id === "infoOv") $("#infoOv").hidden = true; });
$("#camStop").addEventListener("click", () => stopScan());
document.addEventListener("visibilitychange", () => { if (document.hidden && scan) stopScan(); });

if (checkOlympian()) saveLocalOnly();
if (!Array.isArray(S.achSeen)) { checkAchievements(); saveLocalOnly(); }
applyTheme();
renderAll();

/* ================= installable app (PWA build only) ================= */
if (window.LOOTLIFT_PWA) {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let dismissed = false; try { dismissed = localStorage.getItem("lootlift.installHidden") === "1"; } catch {}
  let deferred = null;
  const renderInstall = () => {
    const slot = $("#installSlot"); slot.replaceChildren();
    if (standalone || dismissed) return;
    const hide = h("button", { class: "x", "aria-label": "Hide", onclick: () => { dismissed = true; try { localStorage.setItem("lootlift.installHidden", "1"); } catch {} renderInstall(); } }, "×");
    if (deferred) slot.append(h("div", { class: "install" }, h("p", { text: "Put Rep Quest on your home screen. It works offline too." }),
      h("button", { class: "btn primary", onclick: async () => { deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; renderInstall(); } }, "Install"), hide));
    else if (isIOS) slot.append(h("div", { class: "install" }, h("p", { text: "To install: tap the Share button, then “Add to Home Screen”." }), hide));
  };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; renderInstall(); });
  window.addEventListener("appinstalled", () => { deferred = null; dismissed = true; renderInstall(); });
  renderInstall();
}

/* ================= connect to shared leaderboard ================= */
(async () => {
  if (window.LOOTLIFT_PWA || !window.claude || !window.claude.use) { syncState = "offline"; renderAll(); return; }
  try {
    [db, userCap] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    uid = userCap ? await userCap.id() : null;
  } catch { db = null; }
  if (!db) { syncState = "offline"; renderAll(); return; }

  // leaderboard subscription
  const slowTimer = setTimeout(() => { boardSlow = true; if (tab === "board") renderBoard(); }, 10000);
  db.collection("players").orderBy("xp", "desc").limit(100).onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(slowTimer); boardSlow = false; }
    boardDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "board") renderBoard();
  }, err => { clearTimeout(slowTimer); boardErr = err; if (tab === "board") renderBoard(); });

  if (!uid) { syncState = "signedout"; renderAll(); return; }
  myRef = db.doc("players/" + uid);
  const canWrite = userCap ? await userCap.can("data.write") : null;
  try {
    const snap = await myRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.xp || 0) > S.xp || ((remote.xp || 0) === S.xp && (remote.updatedAt || 0) >= (S.updatedAt || 0))) {
        const { rating, level, ...rest } = remote;
        S = normalize(JSON.parse(JSON.stringify(rest)));
        saveLocalOnly(); applyTheme(); renderAll();
      } else pushRemote();
    } else pushRemote();
  } catch {}
  if (canWrite === false) readOnly = true;
  syncState = readOnly ? "readonly" : "online";
  renderAll();
})();
</script>
