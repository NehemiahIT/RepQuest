<style>
/* Layout: phone-shaped app shell (max 480px, centered on desktop) on a rubber gym floor; fixed bottom tab bar.
   Workout tiers are colored like Olympic bumper plates: 10 kg green, 15 kg yellow, 20 kg blue, 25 kg red. */
:root {
  color-scheme: dark;
  --floor: #14161b;
  --panel: #1e2129;
  --panel-2: #282c36;
  --line: #343946;
  --chalk: #eef0f3;
  --dim: #9097a6;
  --p10: #2fae5b;
  --p15: #f2c230;
  --p20: #2f74d8;
  --p25: #e0393e;
  --r0: #a3abb9;
  --r1: #4fa3ff;
  --r2: #b46cff;
  --r3: #ffb627;
  --r4: #ff4fa3;
  --r5: #ff7a1a;
  --rainbow: linear-gradient(90deg, #ff3b3b, #ffb627, #f2ff3b, #3bff8a, #3bb5ff, #b46cff, #ff4fa3);
  --ink: #101216;
  --display: "Saira Stencil One", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --nav-h: 64px;
}
html, body { background: var(--floor); color: var(--chalk); }
[hidden] { display: none !important; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  background:
    radial-gradient(circle at 20% 10%, #ffffff06 0 1px, transparent 1px) 0 0 / 7px 7px,
    radial-gradient(circle at 70% 60%, #00000040 0 1px, transparent 1px) 0 0 / 5px 5px,
    var(--floor);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--floor); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}

/* ---------- header ---------- */
.top { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--floor); padding-block: 8px 10px; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-size: 28px; letter-spacing: .02em; line-height: 1; margin: 0; }
.brand span { color: var(--p25); }
.lvl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lvl-badge { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; background: var(--chalk); color: var(--ink); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.xpbar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; min-width: 70px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--p10), var(--p15), var(--p20), var(--p25)); border-radius: inherit; transition: width .5s; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; }
.stat b { font-family: var(--label); font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }

/* ---------- bottom nav ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--dim); font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--chalk); }
.nav button[aria-selected="true"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--p25); }
.nav .badge { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--p25); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; letter-spacing: 0; }

/* ---------- generic ---------- */
h2 { font-family: var(--display); font-size: 22px; font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; }
.eyebrow { font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); color: var(--chalk); min-height: 50px; }
.btn.primary { background: var(--chalk); color: var(--ink); }
.btn.go { background: var(--tc, var(--p10)); color: var(--ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.muted { color: var(--dim); }
.note { font-size: 14px; color: var(--dim); margin: 0; }
section[role="tabpanel"] { display: flex; flex-direction: column; gap: 16px; }

/* ---------- plates (tier picker) ---------- */
.plates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.plate { background: none; border: 0; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 12px; }
.plate .disc {
  width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle, #0c0d10 0 13%, #3a3f4a 13.5% 17%, transparent 17.5%),
    radial-gradient(circle, transparent 0 62%, #00000033 62.5% 64%, transparent 64.5%),
    var(--tc);
  box-shadow: inset 0 -5px 0 #00000040, 0 4px 0 #00000055;
  display: grid; place-items: center; transition: transform .15s;
}
.plate .disc b { position: absolute; top: 12%; font-family: var(--label); font-weight: 700; font-size: 13px; color: var(--ink); opacity: .85; }
.plate .nm { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.plate[aria-pressed="true"] .disc { transform: scale(1.06); outline: 3px solid var(--chalk); outline-offset: 3px; }
.plate[aria-pressed="true"] .nm { color: var(--chalk); }
.plate:disabled { opacity: .35; cursor: not-allowed; }
.tierinfo { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--label); font-size: 14px; letter-spacing: .04em; color: var(--dim); }
.tierinfo b { color: var(--chalk); }

/* ---------- workout ---------- */
.wo-head { display: flex; align-items: flex-start; gap: 12px; }
.wo-head .tchip { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--tc); color: var(--ink); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.wo-meta { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--label); font-size: 15px; color: var(--dim); }
.wo-meta b { color: var(--chalk); font-variant-numeric: tabular-nums; }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex { display: flex; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 10px; padding: 12px; min-height: 56px; }
.ex input { width: 26px; height: 26px; accent-color: var(--tc); flex: none; }
.ex label { flex: 1; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
.ex .nm { font-weight: 600; }
.ex .hint { font-size: 13px; color: var(--dim); }
.ex .amt { font-family: var(--label); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ex.done { opacity: .55; }
.ex.done .nm { text-decoration: line-through; }
.ex input:disabled + label { cursor: default; }
.timer { font-family: var(--label); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.lockline { font-family: var(--label); font-size: 15px; color: var(--dim); }
.earned { align-items: center; text-align: center; }

/* ---------- crates ---------- */
.crate {
  --cw: 110px;
  width: var(--cw); aspect-ratio: 1.15; position: relative; border-radius: 6px;
  background:
    linear-gradient(90deg, #00000038 0 9%, transparent 9% 91%, #00000038 91%),
    linear-gradient(0deg, #00000030 0 10%, transparent 10% 74%, #ffffff26 74% 77%, #00000030 77%),
    var(--tc);
  box-shadow: inset 0 0 0 3px #00000040, 0 6px 0 #00000066;
  display: grid; place-items: center;
}
.crate::after { content: attr(data-label); font-family: var(--display); font-size: calc(var(--cw) * .13); color: var(--ink); opacity: .78; margin-top: 14%; }
.crate.glow { box-shadow: inset 0 0 0 3px #00000040, 0 6px 0 #00000066, 0 0 calc(var(--cw) * .22) var(--tc); }
.crate.top {
  background:
    linear-gradient(90deg, #00000038 0 9%, transparent 9% 91%, #00000038 91%),
    linear-gradient(0deg, #00000030 0 10%, transparent 10% 74%, #ffffff40 74% 77%, #00000030 77%),
    var(--rainbow);
  background-size: 100% 100%, 100% 100%, 200% 100%;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer { to { background-position: 0 0, 0 0, 200% 0; } }
.rainbow-text { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
.crate::before { content: ""; position: absolute; left: 42%; right: 42%; top: 18%; height: 14%; background: #0000004d; border-radius: 3px; }
.crategrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.cratecard { background: var(--panel-2); border-radius: 12px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cratecard .nm { font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; }
.odds i { display: block; height: 100%; }
.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.loglist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.loglist .em { font-size: 22px; width: 28px; text-align: center; }
.rtag { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--rc); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 5px; font-family: var(--label); font-size: 13px; color: var(--dim); }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--rc); }

/* ---------- gym room ---------- */
.room { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); position: relative; user-select: none; }
.wall { padding: 12px 10px 14px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-height: 96px; align-items: center; position: relative; }
.wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #00000059; }
.flr { padding: 10px 8px 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 6px; }
.slot { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; position: relative; background: none; border: 0; padding: 0; min-width: 0; }
.wall .slot { background: #ffffff0a; border: 1px dashed #ffffff1f; }
.flr .slot::before { content: ""; position: absolute; left: 14%; right: 14%; bottom: 8%; height: 16%; border-radius: 50%; background: #00000038; }
.slot.filled::before { background: radial-gradient(closest-side, var(--rc), transparent); opacity: .55; }
.wall .slot.filled { border-style: solid; border-color: transparent; background: #00000026; box-shadow: 0 0 14px -4px var(--rc); }
.sprite { font-size: clamp(22px, 8vw, 34px); line-height: 1; position: relative; filter: drop-shadow(0 3px 2px #00000066); }
.flr .r0 .sprite { transform: scale(.82) translateY(4px); }
.flr .r2 .sprite { transform: scale(1.12); }
.neon { font-family: var(--display); font-size: clamp(9px, 2.7vw, 12px); color: #fff; text-shadow: 0 0 4px var(--rc), 0 0 10px var(--rc), 0 0 18px var(--rc); line-height: 1; text-align: center; }
.room.placing .slot.target { outline: 2px dashed var(--chalk); outline-offset: -2px; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { background-color: #ffffff22; } }
.room-label { position: absolute; top: 6px; right: 8px; font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #ffffff80; z-index: 1; pointer-events: none; }

/* wall skins */
.wall.sk-concrete { background: linear-gradient(180deg, #3b404b, #2e323b); }
.wall.sk-brick {
  background-color: #7a3a2c;
  background-image:
    linear-gradient(0deg, #4b2219 2px, transparent 2px),
    linear-gradient(90deg, #4b2219 2px, transparent 2px),
    linear-gradient(90deg, #4b2219 2px, transparent 2px);
  background-size: 100% 18px, 36px 36px, 36px 36px;
  background-position: 0 0, 0 0, 18px 18px;
}
.wall.sk-neon { background: radial-gradient(120% 90% at 50% 0%, #3d1460, #160a26 70%); box-shadow: inset 0 3px 0 #ff3cf0, inset 0 -11px 0 -3px #22e6ff; }
.wall.sk-galaxy {
  background:
    radial-gradient(1px 1px at 10% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 35% 70%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 82% 60%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 50% 50%, #cfd8ff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 92% 15%, #fff 50%, transparent 51%),
    radial-gradient(60% 90% at 25% 40%, #5b2ca0aa, transparent), radial-gradient(60% 80% at 80% 70%, #1f6fb0aa, transparent), #0a0b1e;
}
/* floor skins */
.flr.sk-plain { background: linear-gradient(180deg, #23262d, #1a1c22); }
.flr.sk-rubber { background-color: #17181c; background-image: linear-gradient(45deg, #222429 25%, transparent 25%, transparent 75%, #222429 75%), linear-gradient(45deg, #222429 25%, transparent 25%, transparent 75%, #222429 75%); background-size: 28px 28px; background-position: 0 0, 14px 14px; }
.flr.sk-court { background: repeating-linear-gradient(90deg, #b9824a 0 22px, #a8733f 22px 23px, #c48e55 23px 45px, #a8733f 45px 46px); box-shadow: inset 0 10px 0 -6px #ffffffb0; }
.flr.sk-gold { background: linear-gradient(135deg, #8a6417, #f3c64b 30%, #b88a24 55%, #ffe08a 75%, #9b7019); }
.wall.sk-lava {
  background:
    radial-gradient(40% 30% at 20% 80%, #ff7a1a99, transparent), radial-gradient(30% 40% at 75% 30%, #ff3d1a80, transparent),
    repeating-linear-gradient(115deg, transparent 0 26px, #ff6a1acc 26px 28px, transparent 28px 60px),
    repeating-linear-gradient(35deg, transparent 0 40px, #ff9a3a99 40px 41px, transparent 41px 90px),
    #24100a;
}
.flr.sk-clouds {
  background:
    radial-gradient(28% 40% at 15% 30%, #fff, transparent 70%), radial-gradient(30% 45% at 55% 70%, #fff, transparent 70%),
    radial-gradient(25% 35% at 88% 25%, #fff, transparent 70%), linear-gradient(180deg, #a9d6ff, #e4f3ff);
}
.wall.sk-arena {
  background:
    conic-gradient(from 160deg at 18% 0%, transparent, #fff8d655 8deg, transparent 22deg),
    conic-gradient(from 178deg at 50% 0%, transparent, #fff8d666 8deg, transparent 18deg),
    conic-gradient(from 196deg at 82% 0%, transparent, #fff8d655 8deg, transparent 22deg),
    radial-gradient(circle, #ffffff40 1px, transparent 1.5px) 0 60% / 9px 9px,
    linear-gradient(180deg, #0d1226, #222c55);
}
.flr.sk-platform {
  background:
    linear-gradient(90deg, #111 0 14%, transparent 14% 86%, #111 86%),
    repeating-linear-gradient(90deg, #c99358 0 30px, #b88247 30px 31px),
    #c99358;
}
.wall.sk-lockers {
  background:
    repeating-linear-gradient(0deg, transparent 0 6px, #00000040 6px 7px) 0 8px / 100% 22px no-repeat,
    repeating-linear-gradient(90deg, #4a5b73 0 34px, #22293a 34px 36px);
}
.flr.sk-track { background: repeating-linear-gradient(0deg, #b5452f 0 26px, #f2e9e4 26px 28px); }
.flr.sk-turf {
  background:
    linear-gradient(90deg, transparent 0 49.5%, #ffffffb0 49.5% 50.5%, transparent 50.5%),
    repeating-linear-gradient(90deg, #2f8f3a 0 30px, #2a8034 30px 60px);
}
.slot.top::before { background: conic-gradient(#ff3b3b, #ffb627, #3bff8a, #3bb5ff, #b46cff, #ff3b3b); opacity: .7; filter: blur(4px); }
.reveal.top .rays { background: repeating-conic-gradient(#ff3b3b 0 6deg, transparent 6deg 12deg, #ffb627 12deg 18deg, transparent 18deg 24deg, #3bff8a 24deg 30deg, transparent 30deg 36deg, #3bb5ff 36deg 42deg, transparent 42deg 48deg, #b46cff 48deg 54deg, transparent 54deg 60deg); opacity: .7; }
.rtag.rainbow-text, .eyebrow .rainbow-text { color: transparent; }

/* placing banner + inventory */
.banner { display: flex; align-items: center; gap: 10px; background: var(--chalk); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.banner .em { font-size: 24px; }
.banner button { margin-left: auto; background: var(--ink); color: var(--chalk); border: 0; border-radius: 8px; padding: 8px 12px; font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.invgroup { display: flex; flex-direction: column; gap: 8px; }
.invgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.item { background: var(--panel-2); border: 1px solid transparent; border-radius: 12px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center; min-width: 0; }
.item .em { font-size: 30px; line-height: 1.1; }
.item .nm { font-size: 13px; font-weight: 600; line-height: 1.2; }
.item .ct { position: absolute; top: 6px; right: 8px; font-family: var(--label); font-weight: 700; font-size: 13px; color: var(--dim); }
.item[aria-pressed="true"] { border-color: var(--chalk); }
.item .got { color: var(--p10); }
.item.missing > :not(.nm):not(.kind) { opacity: .35; filter: grayscale(1); }
.item.missing .nm { color: var(--dim); }
.kind { font-size: 12px; color: var(--dim); }
.fold { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 4px 0; min-height: 44px; text-align: left; }
.fold .chev { width: 22px; height: 22px; flex: none; display: grid; place-items: center; color: var(--dim); transition: transform .2s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.item::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--rc); }
.swatch { width: 44px; height: 30px; border-radius: 6px; border: 1px solid #ffffff30; }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stylebox { background: var(--panel-2); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.stylebox > div { min-width: 0; flex: 1; }
.stylebox small { display: block; }
.stylebox button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: var(--label); letter-spacing: .06em; text-transform: uppercase; }

/* ---------- leaderboard ---------- */
.seg { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

function normalize(s) {
  const f = fresh();
  const o = Object.assign(f, s);
  o.room = Object.assign(fresh().room, s.room || {});
  if (!Array.isArray(o.room.wall) || o.room.wall.length !== 6) o.room.wall = fresh().room.wall;
  if (!Array.isArray(o.room.floor) || o.room.floor.length !== 18) o.room.floor = fresh().room.floor;
  if (!Array.isArray(o.perTier)) o.perTier = [0, 0, 0, 0];
  if (!Array.isArray(o.crates)) o.crates = [];
  if (!Array.isArray(o.log)) o.log = [];
  o.inv = o.inv || {};
  return o;
}

const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const levelOf = xp => Math.floor(Math.sqrt(xp / 20)) + 1;
const xpFor = lvl => 20 * (lvl - 1) * (lvl - 1);
function ratingOf(room) {
  let r = 0;
  for (const id of [...room.wall, ...room.floor, room.wallSkin, room.floorSkin]) if (id && ITEM[id]) r += RAR[ITEM[id].r].val;
  return r;
}

/* ================= workouts ================= */
function makeWorkout(t) {
  const T = TIERS[t];
  const pool = EXERCISES.filter(e => (e.min || 0) <= t);
  const ex = shuffle(pool).slice(0, T.count).map(e => {
    const amt = e.kind === "reps" ? Math.max(1, Math.round(e.base * T.mult)) : Math.max(10, Math.round(e.base * T.mult / 5) * 5);
    const secs = e.kind === "reps" ? amt * e.spr : amt;
    return { name: e.name, kind: e.kind, amt, secs, hint: e.hint || "" };
  });
  const est = Math.round(T.rounds * ex.reduce((a, b) => a + b.secs + 10, 0) + (T.rounds - 1) * 45);
  return { tier: t, title: pick(WORDS_A) + " " + pick(WORDS_B), ex, rounds: T.rounds, est, minSecs: Math.round(est * 0.5), startedAt: null, checks: ex.map(() => false), progress: ex.map(() => 0) };
}
function elapsed() { return current && current.startedAt ? (Date.now() - current.startedAt) / 1000 : 0; }

    toast(ITEM[id].name + " moved to storage");
    save(); renderAll();
  }
}
function useItem(id) {
  const it = ITEM[id]; if (!it || !S.inv[id]) return;
  if (it.slot === "wallSkin" || it.slot === "floorSkin") {
    const key = it.slot;
    const old = S.room[key];
    if (ITEM[old]) S.inv[old] = (S.inv[old] || 0) + 1;
    S.room[key] = id;
    S.inv[id] -= 1; if (S.inv[id] <= 0) delete S.inv[id];
    toast(it.name + " on");
    save(); renderAll();
    return;
  }
  placing = placing === id ? null : id;
  renderGym();
  if (placing) document.querySelector("#tab-gym .room").scrollIntoView({ block: "center", behavior: "smooth" });
}
function removeSkin(key) {
  const old = S.room[key]; if (!ITEM[old]) return;
  S.inv[old] = (S.inv[old] || 0) + 1;
  S.room[key] = key === "wallSkin" ? "concrete" : "plain";
  save(); renderAll();
}
function renderGym() {
  const root = $("#tab-gym"); root.replaceChildren();
  root.append(h("div", { class: "row" }, h("h2", { text: "My Gym" }), h("span", { class: "spacer" }), h("span", { class: "eyebrow", text: "Tap gear to move it" })));
  if (placing) {
    const it = ITEM[placing];
    root.append(h("div", { class: "banner" }, h("span", { class: "em", text: it.e || "✨" }), h("span", { text: `Tap a glowing ${it.slot} spot` }), h("button", { onclick: () => { placing = null; renderGym(); } }, "Cancel")));
  }
  root.append(roomView(S.room, true));

  // current styles
  const skinBox = (key, label, def) => {
    const id = S.room[key], it = ITEM[id];
    return h("div", { class: "stylebox" },
      h("div", { class: "swatch", style: `background:${SKIN_CSS[it ? it.sw : def]}` }),
      h("div", {}, h("small", { class: "eyebrow", text: label }), h("b", { text: it ? it.name : (def === "concrete" ? "Concrete" : "Plain floor") })),
      it ? h("button", { onclick: () => removeSkin(key) }, "Off") : null);
  };
  root.append(h("div", { class: "styles" }, skinBox("wallSkin", "Walls", "concrete"), skinBox("floorSkin", "Floor", "plain")));

  // storage
  const owned = ITEMS.filter(i => S.inv[i.id] > 0);
  const card = h("div", { class: "card" }, h("h2", { text: "Storage" }));
  if (!owned.length) {
    card.append(h("p", { class: "note", text: "Everything you own is in your gym. Open crates to get more gear, decor and room styles." }));
  } else {
    const groups = [["floor", "Gym gear"], ["wall", "Wall decor"], ["skin", "Room styles"]];
    for (const [g, label] of groups) {
      const items = owned.filter(i => g === "skin" ? i.slot.endsWith("Skin") : i.slot === g).sort((a, b) => b.r - a.r);
      if (!items.length) continue;
      const grid = h("div", { class: "invgrid" });
      items.forEach(it => grid.append(h("button", { class: "item", style: `--rc:${RAR[it.r].color}`, "aria-pressed": String(placing === it.id), onclick: () => useItem(it.id) },
        S.inv[it.id] > 1 ? h("span", { class: "ct", text: "×" + S.inv[it.id] }) : null,
        it.sw ? h("span", { class: "swatch", style: `background:${SKIN_CSS[it.sw]}` }) : h("span", { class: "em", text: it.e || "✨" }),
        h("span", { class: "nm", text: it.name }),
        h("span", { class: "rtag", text: RAR[it.r].label }))));
      card.append(h("div", { class: "invgroup" }, h("div", { class: "eyebrow", text: label }), grid));
    }
  }
  root.append(card);

  // every item you can get from crates, by rarity
  const found = new Set([...Object.keys(S.inv), ...S.room.wall, ...S.room.floor, S.room.wallSkin, S.room.floorSkin].filter(id => ITEM[id]));
  const all = h("div", { class: "card" },
    h("button", { class: "fold", "aria-expanded": String(allOpen), "aria-controls": "allItems", onclick: () => { allOpen = !allOpen; try { localStorage.setItem("lootlift.allOpen", allOpen ? "1" : "0"); } catch {} renderGym(); } },
      h("h2", { text: "All items" }), h("span", { class: "spacer" }),
      h("span", { class: "eyebrow", text: `${found.size} of ${ITEMS.length} found` }),
      h("span", { class: "chev", "aria-hidden": "true" })));
  all.querySelector(".chev").innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  root.append(all);
  if (!allOpen) return;
  all.id = "allItems";
  all.append(h("p", { class: "note", text: "Everything you can get from crates. Faded items are ones you haven't found yet." }));
  RAR.forEach((R, r) => {
    const items = ITEMS.filter(i => i.r === r);
    const have = items.filter(i => found.has(i.id)).length;
    const from = CRATE_DROPS.map((o, c) => o[r] ? RAR[c].label : null).filter(Boolean);
    const grid = h("div", { class: "invgrid" });
    items.forEach(it => grid.append(h("div", { class: "item" + (found.has(it.id) ? "" : " missing"), style: `--rc:${r === TOP ? "var(--r5)" : R.color}`, title: it.d },
      found.has(it.id) ? h("span", { class: "ct got", "aria-label": "Found", text: "✓" }) : null,
      it.sw ? h("span", { class: "swatch", style: `background:${SKIN_CSS[it.sw]}` }) : it.txt ? h("span", { class: "neon", style: "padding:9px 0", text: it.txt }) : h("span", { class: "em", text: it.e }),
      h("span", { class: "nm", text: it.name }),
      h("span", { class: "kind", text: it.slot === "wall" ? "Wall decor" : it.slot === "floor" ? "Gym gear" : it.slot === "wallSkin" ? "Wall style" : "Floor style" }))));
    all.append(h("div", { class: "invgroup" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("span", { class: "eyebrow", style: "font-size:14px" }, rarText(r, R.label)),
        h("span", { class: "eyebrow", text: `${have} / ${items.length}` })),
      h("div", { class: "kind", text: "Found in " + from.join(", ") + " crates" }),
      grid));
  });
}

/* ================= tab: leaderboard ================= */
let boardDocs = null, boardErr = null, boardSlow = false;
async function renderBoard() {
  const root = $("#tab-board");
  root.replaceChildren();
  root.append(h("div", { class: "row" }, h("h2", { text: "Leaderboard" }), h("span", { class: "spacer" }),
    h("div", { class: "seg", role: "group", "aria-label": "Rank by" },
      h("button", { "aria-pressed": String(boardSort === "xp"), onclick: () => { boardSort = "xp"; renderBoard(); } }, "XP"),
      h("button", { "aria-pressed": String(boardSort === "rating"), onclick: () => { boardSort = "rating"; renderBoard(); } }, "Gym"))));

  const note = h("div", { class: "syncnote" });
  const say = (on, txt) => note.append(h("span", { class: "dot" + (on ? " on" : "") }), h("span", { text: txt }));
  if (syncState === "online") say(true, S.xp > 0 ? "You're on the board. Progress saves to your account." : "Finish one workout to join the board.");
  else if (syncState === "readonly") say(false, "You can see the board, but only people the owner shares this app with as Contributor can join. Progress saves on this phone.");
  else if (syncState === "connecting") say(false, "Connecting to the leaderboard…");
  else say(false, "Players on this phone. Add friends or family who train with you.");
  root.append(note);

  const list = h("ol", { class: "board" });
  root.append(list);

  if (!db) {
    if (syncState !== "connecting") renderLocalBoard(root, list);
    return;
  }
  if (boardErr) { list.append(h("li", { class: "empty", text: "Couldn't load the leaderboard. Reopen the app to try again." })); return; }
  if (!boardDocs) { list.append(h("li", { class: "empty", text: boardSlow ? "Can't reach the leaderboard yet. Still trying…" : "Loading…" })); return; }

  const rows = boardDocs.filter(d => (d.xp || 0) > 0).sort((a, b) => boardSort === "xp" ? (b.xp - a.xp) || (b.rating - a.rating) : (b.rating - a.rating) || (b.xp - a.xp));
  if (!rows.length) { list.append(h("li", { class: "empty", text: "Nobody's on the board yet. Finish a workout to take first place." })); return; }

  const profs = userCap ? await userCap.profiles(rows.map(r => r.id)) : {};
  if (tab !== "board") return;
  list.replaceChildren();
  rows.forEach((r, i) => {
    const p = profs[r.id] || {};
    const isMe = r.id === uid;
    const name = isMe ? (p.name ? p.name + " (you)" : "You") : (p.name || "Lifter");
    list.append(h("li", { style: "display:contents" },
      h("button", { class: "lb" + (isMe ? " me" : ""), onclick: () => showGym(r, name) },
        h("span", { class: "rk", text: i + 1 }),
        p.avatarUrl ? h("img", { src: p.avatarUrl, alt: "" }) : h("span", { class: "dot", style: "width:38px;height:38px" }),
        h("span", { class: "who" }, h("b", { text: name }), h("small", { text: `Lvl ${levelOf(r.xp || 0)} · ${r.workouts || 0} workouts · tap to see gym` })),
        h("span", { class: "sc" }, boardSort === "xp" ? (r.xp || 0) : (r.rating || 0), h("small", { text: boardSort === "xp" ? "XP" : "Gym" })))));
  });
}
function renderLocalBoard(root, list) {
  const rows = Object.entries(store.players).map(([pid, p]) => {
    const st = pid === store.active ? S : normalize(p.state || {});
    return { id: pid, name: p.name, xp: st.xp, workouts: st.workouts, perTier: st.perTier, room: st.room, rating: ratingOf(st.room) };
  }).sort((a, b) => boardSort === "xp" ? (b.xp - a.xp) || (b.rating - a.rating) : (b.rating - a.rating) || (b.xp - a.xp));
  rows.forEach((r, i) => {
    const isMe = r.id === store.active;
    list.append(h("li", { style: "display:contents" },
      h("button", { class: "lb" + (isMe ? " me" : ""), onclick: () => showGym(r, r.name, isMe ? null : () => switchPlayer(r.id)) },
        h("span", { class: "rk", text: i + 1 }),
        h("span", { class: "avatar", text: r.name.slice(0, 1).toUpperCase() }),
        h("span", { class: "who" }, h("b", { text: r.name + (isMe ? " (playing)" : "") }), h("small", { text: `Lvl ${levelOf(r.xp)} · ${r.workouts} workouts · ${isMe ? "tap to see gym" : "tap to see gym or switch"}` })),
        h("span", { class: "sc" }, boardSort === "xp" ? r.xp : r.rating, h("small", { text: boardSort === "xp" ? "XP" : "Gym" })))));
  });

  const input = h("input", { id: "newPlayer", type: "text", maxlength: "20", placeholder: "Name", autocomplete: "off", "aria-label": "New player name" });
  const form = h("form", { class: "card", onsubmit: e => { e.preventDefault(); addPlayer(input.value); } },
    h("h2", { text: "Add a player" }),
    h("p", { class: "note", text: "Everyone gets their own workouts, crates and gym. Switch players from this list." }),
    h("div", { class: "row" }, input, h("button", { class: "btn primary", type: "submit" }, "Add")));
  const ren = h("form", { class: "row", onsubmit: e => { e.preventDefault(); const v = renIn.value.trim().slice(0, 20); if (v) { me.name = v; saveLocalOnly(); renderAll(); toast("Name saved"); } } });
  const renIn = h("input", { id: "renamePlayer", type: "text", maxlength: "20", value: me.name, "aria-label": "Your player name" });
  ren.append(renIn, h("button", { class: "btn ghost", type: "submit" }, "Rename"));
  root.append(form, h("div", { class: "card" }, h("span", { class: "eyebrow", text: "Your name" }), ren));
}
function showGym(r, name, onSwitch) {
  const room = normalize({ room: r.room || {} }).room;
  const inner = $("#gymOvInner");
  const per = Array.isArray(r.perTier) ? r.perTier : [0, 0, 0, 0];
  inner.replaceChildren(
    h("button", { class: "closex", "aria-label": "Close", onclick: () => { $("#gymOv").hidden = true; } }, "×"),
    h("div", { class: "eyebrow", text: `Level ${levelOf(r.xp || 0)} · ${r.xp || 0} XP` }),
    h("h2", { style: "padding-right:48px", text: name + "'s gym" }),
    roomView(room, false),
    h("div", { class: "plates" }, TIERS.map((T, i) => h("div", { class: "stat", style: `border-top:3px solid ${T.color}` }, h("b", { text: per[i] || 0 }), h("small", { text: T.name })))),
    onSwitch ? h("button", { class: "btn primary wide", onclick: () => { $("#gymOv").hidden = true; onSwitch(); } }, "Play as " + name) : null,
    h("button", { class: "btn ghost wide", onclick: () => { $("#gymOv").hidden = true; } }, "Close"));
  $("#gymOv").hidden = false;
}

/* ================= tabs ================= */
function setTab(t) {
  tab = t;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  document.querySelectorAll("section[role=tabpanel]").forEach(s => { s.hidden = s.id !== "tab-" + t; });
  if (t !== "gym") placing = null;
  renderTab();
  window.scrollTo({ top: 0 });
}
function renderTab() {
  if (tab === "workout") renderWorkout();
  else if (tab === "crates") renderCrates();
  else if (tab === "gym") renderGym();
  else renderBoard();
}
function renderAll() { renderHeader(); renderTab(); }
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
for (const id of ["#crateOv", "#gymOv"]) $(id).addEventListener("click", e => { if (e.target.id === id.slice(1) && id === "#gymOv") $(id).hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#gymOv").hidden = true; $("#infoOv").hidden = true; if (scan) stopScan(); } });
$("#infoOv").addEventListener("click", e => { if (e.target.id === "infoOv") $("#infoOv").hidden = true; });
$("#camStop").addEventListener("click", () => stopScan());
document.addEventListener("visibilitychange", () => { if (document.hidden && scan) stopScan(); });

renderAll();

/* ================= installable app (PWA build only) ================= */
if (window.LOOTLIFT_PWA) {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let dismissed = false; try { dismissed = localStorage.getItem("lootlift.installHidden") === "1"; } catch {}
  let deferred = null;
  const renderInstall = () => {
    const slot = $("#installSlot"); slot.replaceChildren();
    if (standalone || dismissed) return;
    const hide = h("button", { class: "x", "aria-label": "Hide", onclick: () => { dismissed = true; try { localStorage.setItem("lootlift.installHidden", "1"); } catch {} renderInstall(); } }, "×");
    if (deferred) slot.append(h("div", { class: "install" }, h("p", { text: "Put Rep Quest on your home screen. It works offline too." }),
      h("button", { class: "btn primary", onclick: async () => { deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; renderInstall(); } }, "Install"), hide));
    else if (isIOS) slot.append(h("div", { class: "install" }, h("p", { text: "To install: tap the Share button, then “Add to Home Screen”." }), hide));
  };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; renderInstall(); });
  window.addEventListener("appinstalled", () => { deferred = null; dismissed = true; renderInstall(); });
  renderInstall();
}

/* ================= connect to shared leaderboard ================= */
(async () => {
  if (window.LOOTLIFT_PWA || !window.claude || !window.claude.use) { syncState = "offline"; renderAll(); return; }
  try {
    [db, userCap] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    uid = userCap ? await userCap.id() : null;
  } catch { db = null; }
  if (!db) { syncState = "offline"; renderAll(); return; }

  // leaderboard subscription
  const slowTimer = setTimeout(() => { boardSlow = true; if (tab === "board") renderBoard(); }, 10000);
  db.collection("players").orderBy("xp", "desc").limit(100).onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(slowTimer); boardSlow = false; }
    boardDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "board") renderBoard();
  }, err => { clearTimeout(slowTimer); boardErr = err; if (tab === "board") renderBoard(); });

  if (!uid) { syncState = "signedout"; renderAll(); return; }
  myRef = db.doc("players/" + uid);
  const canWrite = userCap ? await userCap.can("data.write") : null;
  try {
    const snap = await myRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.xp || 0) > S.xp || ((remote.xp || 0) === S.xp && (remote.updatedAt || 0) >= (S.updatedAt || 0))) {
        const { rating, level, ...rest } = remote;
        S = normalize(JSON.parse(JSON.stringify(rest)));
        saveLocalOnly(); renderAll();
      } else pushRemote();
    } else pushRemote();
  } catch {}
  if (canWrite === false) readOnly = true;
  syncState = readOnly ? "readonly" : "online";
  renderAll();
})();
</script>
